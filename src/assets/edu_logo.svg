<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <radialGradient id="goldSheen" cx="35%" cy="30%" r="65%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#E8C87E"/>
      <stop offset="40%" stop-color="#C9A96E"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#9A6A1F"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="50%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#005BB5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AD787"/>
      <stop offset="100%" stop-color="#34c759"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#B8860B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background shield for contrast on any background -->
  <g filter="url(#iconShadow)">
    <!-- Crest / Shield shape -->
    <path d="M90,25 L150,25 L150,75 C150,110 125,135 90,150 C55,135 30,110 30,75 L30,25 L90,25 Z" 
          fill="none" stroke="url(#goldSheen)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner shield border -->
    <path d="M90,35 L142,35 L142,76 C142,105 120,127 90,140 C60,127 38,105 38,76 L38,35 L90,35 Z" 
          fill="none" stroke="url(#goldSheen)" stroke-width="1" stroke-linejoin="round" opacity="0.6"/>

    <!-- Ornamental top line inside shield -->
    <line x1="50" y1="42" x2="130" y2="42" stroke="url(#goldSheen)" stroke-width="0.8" opacity="0.5"/>

    <!-- Open book / education symbol -->
    <g transform="translate(90, 85)">
      <!-- Left page -->
      <path d="M-28,-20 Q-14,-32 0,-20 L0,18 Q-14,6 -28,18 Z" 
            fill="url(#blueGrad)" opacity="0.9"/>
      <!-- Right page -->
      <path d="M28,-20 Q14,-32 0,-20 L0,18 Q14,6 28,18 Z" 
            fill="url(#blueGrad)" opacity="0.9"/>
      <!-- Book spine highlight -->
      <line x1="0" y1="-20" x2="0" y2="18" stroke="url(#goldSheen)" stroke-width="1.2"/>
      <!-- Page lines left -->
      <line x1="-20" y1="-10" x2="-5" y2="-10" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
      <line x1="-20" y1="-4" x2="-5" y2="-4" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
      <line x1="-20" y1="2" x2="-5" y2="2" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
      <!-- Page lines right -->
      <line x1="5" y1="-10" x2="20" y2="-10" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
      <line x1="5" y1="-4" x2="20" y2="-4" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
      <line x1="5" y1="2" x2="20" y2="2" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
    </g>

    <!-- Graduation cap above book -->
    <g transform="translate(90, 52)">
      <polygon points="-24,-4 0,-14 24,-4 0,6" fill="url(#greenGrad)" opacity="0.95"/>
      <polygon points="-24,-4 0,6 24,-4 0,2" fill="#34c759" opacity="0.5"/>
      <line x1="0" y1="-14" x2="0" y2="6" stroke="url(#goldSheen)" stroke-width="0.8"/>
      <line x1="-14" y1="-8" x2="-2" y2="-8" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
      <line x1="2" y1="-8" x2="14" y2="-8" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
    </g>

    <!-- Laurel branch left -->
    <g transform="translate(38, 95)" stroke="url(#goldSheen)" stroke-width="0.8" fill="none" opacity="0.7">
      <path d="M-5,25 Q-18,10 -12,-5" />
      <path d="M-8,20 Q-15,12 -12,5" />
      <path d="M-4,15 Q-15,4 -10,-8" />
      <ellipse cx="-16" cy="8" rx="4" ry="2" transform="rotate(-30 -16 8)" stroke-width="0.6"/>
      <ellipse cx="-13" cy="-2" rx="4" ry="2" transform="rotate(-20 -13 -2)" stroke-width="0.6"/>
      <ellipse cx="-17" cy="-1" rx="4" ry="2" transform="rotate(-40 -17 -1)" stroke-width="0.6"/>
    </g>

    <!-- Laurel branch right -->
    <g transform="translate(142, 95)" stroke="url(#goldSheen)" stroke-width="0.8" fill="none" opacity="0.7">
      <path d="M5,25 Q18,10 12,-5" />
      <path d="M8,20 Q15,12 12,5" />
      <path d="M4,15 Q15,4 10,-8" />
      <ellipse cx="16" cy="8" rx="4" ry="2" transform="rotate(30 16 8)" stroke-width="0.6"/>
      <ellipse cx="13" cy="-2" rx="4" ry="2" transform="rotate(20 13 -2)" stroke-width="0.6"/>
      <ellipse cx="17" cy="-1" rx="4" ry="2" transform="rotate(40 17 -1)" stroke-width="0.6"/>
    </g>

    <!-- Star ornament at top -->
    <polygon points="90,18 92,24 98,24 93,28 95,34 90,30 85,34 87,28 82,24 88,24" 
             fill="url(#goldSheen)" opacity="0.8"/>
  </g>

  <!-- Brand Name Text -->
  <g transform="translate(185, 0)">
    <text x="0" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="36" 
          font-weight="bold" letter-spacing="4" fill="url(#blueGrad)">EDU</text>
    
    <text x="0" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="18" 
          font-weight="normal" letter-spacing="8" fill="url(#goldSheen)">INITIATIVE</text>

    <!-- Decorative divider line -->
    <line x1="2" y1="122" x2="175" y2="122" stroke="url(#goldSheen)" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Small diamond ornament on divider -->
    <rect x="84" y="117" width="8" height="8" transform="rotate(45 88 121)" 
          fill="url(#goldSheen)" opacity="0.8"/>

    <!-- Tagline -->
    <text x="0" y="142" font-family="Arial, Helvetica, sans-serif" font-size="10" 
          font-weight="normal" letter-spacing="5" fill="#34c759" opacity="0.9">E-COMMERCE EDUCATION</text>
  </g>
</svg>